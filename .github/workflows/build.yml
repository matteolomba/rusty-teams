  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: build

      # After the toolchain: staging runs `cargo metadata`.
      - uses: ./.github/actions/setup-windows

      # fxc.exe comes from the Windows SDK, gpui-pre-windows finds it through the registry.
      - name: Build
        run: cargo build -p app --release --config "patch.crates-io.gpui-pre-windows.path=\"$GPUI_PRE_WINDOWS_PATCHED\""

      # The runner is x86_64; the artifact name carries the architecture.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: teams-windows-amd64
          path: target/release/teams.exe

