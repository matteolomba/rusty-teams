  release-windows:
    name: Release (Windows)
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the Windows x64 binary is built in this fork; other platforms stay commented out.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: teams-windows-amd64
          path: dist

      # The name matches the asset the fork's release feed looks for (release_feed.rs).
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          cp dist/teams.exe "rusty-teams-$ver-windows-amd64.exe"

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: rusty-teams-*-windows-amd64.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
